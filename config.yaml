# STT pipeline configuration.
# Relative paths are resolved from the project folder, so this file works on Windows and Ubuntu.

model:
  size: small.en          # tiny.en | base.en | small.en | medium.en | large-v3
  device: auto            # auto (GPU if available, else CPU) | cuda | cpu
  compute_type: auto      # auto: float16 on GPU, int8 on CPU
  download_dir: models
  language: en
  beam_size: 5
  #initial_prompt: ""      # optional vocabulary hint, e.g. "kitchen, lab, office, coffee"
  #initial_prompt: "Walk straight, turn left, turn right, stop near the person or the ladder."
  initial_prompt: ""      # tested 6 Oct: caused inserted words ("Walk straight"); kept off for safety
  word_timestamps: true   # per-word timing and confidence

audio:
  sample_rate: 16000      # Whisper expects 16 kHz mono
  input_device: null      # null = system default mic, or a device index / name
  max_record_seconds: 15  # safety cap on one recording
  pre_roll_seconds: 0.5   # audio kept from just before Start is pressed
  post_roll_seconds: 0.4  # keep recording briefly after Stop, so the last word is not cut

vad:
  enabled: true
  min_silence_ms: 500     # pause length that splits speech segments
  speech_pad_ms: 200      # padding kept around detected speech

gate:
  reject_empty: true          # never forward empty transcripts
  max_no_speech_prob: 0.6     # noise only if this is exceeded...
  noise_max_logprob: -1.0     # ...AND the words are this uncertain (same rule as Whisper itself)
  min_confidence: 0.0         # 0 = forward everything (per Sep 23 meeting); raise later if needed

output:
  #sinks: [console, jsonl, http]   # any of: console, jsonl, http, ros2
  sinks: [console, jsonl]   # add http when the VLN receiver is running
  jsonl_path: outputs/commands.jsonl
  save_audio: false           # keep recordings for debugging / evaluation only
  audio_dir: recordings

http:
  url: http://127.0.0.1:5000/command   # VLN's web address (placeholder, confirm with VLN team)
  timeout_s: 1.0                       # give up after this, so a VLN problem never blocks STT
  send_rejected: false                 # only accepted commands reach VLN

ros2:
  topic: /stt/command         # confirm with VLN team
  node_name: stt_publisher
  publish_rejected: false     # only accepted commands reach VLN

ui:
  host: 127.0.0.1             # this machine only; 0.0.0.0 would expose it on the network
  port: 8765
  history_size: 20            # commands shown in "Recent commands"